[package]
name = "rmux-jump"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rmux-jump"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
rmux-client = "0.6.1"
rmux-proto = "0.6.1"
rmux-sdk = { version = "0.6.1", default-features = false }
tokio = { version = "1.48.0", features = ["net", "rt", "time"] }
